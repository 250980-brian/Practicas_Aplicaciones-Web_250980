<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MecaGest: Formulario de Reagistro de Nuevos Usuarios - M250917 </title>
</head>
<body>
    <header>
        <h1>MecaGest</h1>
        <h2>Registro de Nuveos Usuarios</h2>
        <p>Complete los campos para solicitar una cuenta en el sistema.</p>
    </header>

    <main>
        <form action =" " method="post">
            <fieldset>
                <legend> Datos Personales </legend>

                <label for="tituloCortesia">Título de Cortesía: </label>
            <select id="tituloCortesia">
                <option>Sr.</option>
                <option>Sra.</option>
                <option>Srita.</option>
                <option>Ing.</option>
                <option>Dr.</option>
                <option>Mtro.</option>
                <option>Ninguno</option>
            </select>

            <br>
            
            <label for = "nombre"> Nombre: </label>
            <input type ="text" id="nombre" placeholder="Dulce Marbella" required>

            <br>

            <label for = "AppPaterno"> Apellido Paterno: </label>
            <input type="text" id="AppPaterno" placeholder="Tolentino" required>

            <br>  

            <label for ="AppMaterno"> Apellido Materno: </label>
            <input type="text" id="AppMaterno" placeholder="García"> 

            <br>    

            <label for ="genero"> Género: </label>
            <select id="genero">
                <option value = "F">Femenino</option>
                <option value = "M">Masculino</option>
                <option value = "X">Prefiero no decirlo</option>
            </select>

            <br>

            <label for = "Fecha Nacimiento"> Fecha de Nacimiento: </label>
            <input type ="date" id="Fecha Nacimiento"> 

            </fieldset>

            <br>    

            <fieldset>
                <legend> Datos de contacto </legend>

            <label for = "correo"> Correo Electrónico: </label>
            <input type ="email" id="correo" placeholder="dulcegr891@gmail.com"> 

            <br>

            <label for = "telefono"> Num. Telefonico: </label>
            <input type ="tel" id="telefono" placeholder="(52) 782-100-44-10">

            <br>

            <label for="horarioContacto"> Favor de contactar en el horario: </label>
            <input type="time" id="horarioContacto" placeholder="9:00">
            <input type="time" id="horarioContacto" placeholder="18:00"> 

            </fieldset>

            <fieldset>
                <legend>Datos de Acceso</legend>
                <label for="usuario"> Usuario: </label>
                <input type="text" id="usuario" placeholder="dulcegarcia" required>

                <br>

                <label for="contrasena"> Contraseña: </label>
                <input type="password" id="contrasena" placeholder="**********" required>

                <br>

                <label for="confirmarContrasena"> Confimar Contraseña: </label>
                <input type="password" id="confirmarContrasena" placeholder="***********" required> 
            </fieldset>

            <fieldset>
                <legend>Datos de Ubicación</legend>

                <label for="direccion"> Dirección: </label>
                <input type="text" id="direccion" placeholder="Calle, Numero, Colonia, Ciudad, Estado, Codigo Postal">

                <br>

                <label for="pais"> País: </label>
                <input type="text" id="pais" placeholder="Mexico" >

                <br> 

                <label for="estado"> Estado: </label>
                <input type="text" id="estado" placeholder="Ciudad de Mexico">

                <br>

                <label for="ciudad"> Ciudad: </label>
                <input type="text" id="ciudad" placeholder="Ciudad de Mexico">

                <br>

                <label for="codigoPostal" > Codigo Postal: </label>
                <input type="text" id="codigoPostal" placeholder="78000">

            </fieldset>

            

</main>
</body>
</html>
